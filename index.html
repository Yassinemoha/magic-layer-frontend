<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Layer - تقسيم إلى 4 طبقات</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 15px; }
        input[type="file"] {
            display: block;
            margin: 15px auto;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            width: 90%;
        }
        button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background-color: #0052a3; }
        #result { margin-top: 20px; text-align: right; }
        .layer-box {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .layer-box img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }
        .download-btn {
            background-color: #27ae60;
            padding: 6px 12px;
            font-size: 14px;
            width: auto;
            margin: 0;
            text-decoration: none;
            color: white;
            border-radius: 4px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎨 Magic Layer</h2>
        <p>ارفع صورتك لتقسيمها إلى 4 طبقات قابلة للتحميل</p>
        
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="processImage()">تقسيم إلى 4 طبقات</button>
        
        <div id="result"></div>
    </div>

    <script>
        const BACKEND_URL = 'https://magic-layer-backend.vercel.app';

        function processImage() {
            const fileInput = document.getElementById('imageInput');
            const resultDiv = document.getElementById('result');

            if (fileInput.files.length === 0) {
                resultDiv.innerHTML = '<p style="color: #e74c3c; text-align: center;">الرجاء اختيار صورة أولاً!</p>';
                return;
            }

            const file = fileInput.files[0];
            resultDiv.innerHTML = '<p style="color: #f39c12; text-align: center;">جاري معالجة وتقسيم الطبقات...</p>';

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Image = event.target.result;

                fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.layers) {
                        let html = `<p style="color: #27ae60; font-weight: bold; text-align: center;">${data.message}</p>`;
                        data.layers.forEach((layer, index) => {
                            html += `
                                <div class="layer-box">
                                    <div style="display: flex; align-items: center; gap: 10px;">
                                        <img src="${layer.data}" alt="Layer">
                                        <span>${layer.name}</span>
                                    </div>
                                    <a href="${layer.data}" download="layer_${index + 1}.png" class="download-btn">تحميل</a>
                                </div>
                            `;
                        });
                        resultDiv.innerHTML = html;
                    } else {
                        resultDiv.innerHTML = '<p style="color: #e74c3c; text-align: center;">حدث خطأ في استجابة الخادم.</p>';
                    }
                })
                .catch(error => {
                    resultDiv.innerHTML = '<p style="color: #e74c3c; text-align: center;">خطأ في الاتصال بالخادم.</p>';
                    console.error('Error:', error);
                });
            };
            reader.readAsDataURL(file);
        }
    </script>

</body>
</html>
