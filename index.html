<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Layer - تقسيم الصور</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        input[type="file"] {
            display: block;
            margin: 15px auto;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            width: 90%;
        }
        button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background-color: #0052a3; }
        #result {
            margin-top: 20px;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎨 Magic Layer</h2>
        <p>ارفع صورتك لمعالجتها واستخراج أبعادها بـ Pillow</p>
        
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="processImage()">إرسال الصورة ومعالجتها</button>
        
        <div id="result"></div>
    </div>

    <script>
        const BACKEND_URL = 'https://magic-layer-backend.vercel.app';

        function processImage() {
            const fileInput = document.getElementById('imageInput');
            const resultDiv = document.getElementById('result');

            if (fileInput.files.length === 0) {
                resultDiv.style.color = '#e74c3c';
                resultDiv.innerText = 'الرجاء اختيار صورة أولاً!';
                return;
            }

            const file = fileInput.files[0];
            resultDiv.style.color = '#f39c12';
            resultDiv.innerText = 'جاري رفع المعالجة...';

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Image = event.target.result;

                fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ image: base64Image })
                })
                .then(response => response.json())
                .then(data => {
                    resultDiv.style.color = '#27ae60';
                    if (data.width && data.height) {
                        resultDiv.innerHTML = `✅ نجاح! الأبعاد الحقيقية: ${data.width} × ${data.height} بكسل<br><small>${data.message}</small>`;
                    } else {
                        resultDiv.innerText = '⚠️ استابعت الاستجابة ولكن بدون أبعاد واضحة.';
                    }
                })
                .catch(error => {
                    resultDiv.style.color = '#e74c3c';
                    resultDiv.innerText = '❌ حدث خطأ أثناء الاتصال بالخادم.';
                    console.error('Error:', error);
                });
            };
            reader.readAsDataURL(file);
        }
    </script>

</body>
</html>
