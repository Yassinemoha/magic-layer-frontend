<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Layer - معالجة الصور</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        input[type="file"] { margin: 20px 0; padding: 10px; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; color: #333; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <h2>Magic Layer 🎨</h2>
    <p>ارفع صورتك لاختبار اتصال الخادم ومعالجتها</p>
    
    <input type="file" id="imageInput" accept="image/*">
    <br>
    <button onclick="uploadImage()">إرسال الصورة ومعالجتها</button>
    
    <div id="result"></div>
</div>

<script>
    async function uploadImage() {
        const fileInput = document.getElementById('imageInput');
        const resultDiv = document.getElementById('result');

        if (fileInput.files.length === 0) {
            alert('الرجاء اختيار صورة أولاً!');
            return;
        }

        const formData = new FormData();
        formData.append('image', fileInput.files[0]);

        resultDiv.innerHTML = 'جاري رفع الصورة ومعالجتها... ⏳';

        try {
            const response = await fetch('https://magic-layer-backend.vercel.app', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            
            if (response.ok) {
                resultDiv.innerHTML = `✅ نجاح! أبعاد الصورة: ${data.width} × ${data.height} بكسل`;
            } else {
                resultDiv.innerHTML = `❌ خطأ من الخادم: ${data.error || 'خطأ غير معروف'}`;
            }
        } catch (error) {
            resultDiv.innerHTML = `❌ خطأ في الاتصال: ${error.message}`;
        }
    }
</script>

</body>
</html>
